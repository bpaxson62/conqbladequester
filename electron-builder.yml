appId: com.bpaxson62.cbquestlog
productName: CB Quest Log
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**

# Bundled quest data (data/unlocks/*, data/seasons.json), read at startup
# so every install ships pre-populated — see src/main/content.ts.
extraResources:
  - from: data
    to: data

# --- Windows ---
win:
  executableName: cb-quest-log
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always

# --- macOS ---
mac:
  artifactName: ${name}-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.strategy-games
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false

# --- Linux ---
linux:
  artifactName: ${name}-${version}-${arch}.${ext}
  # Without this the Linux binary is named from productName ("CB Quest Log"),
  # which is not a sane executable name and makes the generated .desktop file
  # harder to match against the running window.
  executableName: cb-quest-log
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    # Fedora/RHEL/openSUSE are RPM distros. Without this the only option there
    # is the AppImage, which ships no .desktop file unless the user integrates
    # it by hand — so the desktop shows a generic icon no matter what art we
    # bundle. Requires `rpm` on the build host (installed in CI).
    - target: rpm
      arch: [x64, arm64]
  maintainer: Brian <bpaxson62@users.noreply.github.com>
  category: Game
  synopsis: Quest tracker for Conqueror's Blade seasonal unit unlocks
  desktop:
    # GNOME Shell matches a window to its .desktop file to decide what icon to
    # show in the dash. If nothing matches it falls back to the generic
    # application-x-executable cog. Electron's WM_CLASS does not necessarily
    # equal the desktop file's basename, so state it explicitly.
    StartupWMClass: cb-quest-log

npmRebuild: false

publish:
  provider: github
  owner: bpaxson62
  repo: conqbladequester
  releaseType: draft
