name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write # required so the release step can create/attach to a GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron-builder shells out to rpmbuild for the .rpm target; the
      # ubuntu runner image doesn't ship it.
      - name: Install rpm tooling (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # On a normal push/PR this just verifies the app builds on every OS.
      # On a v* tag push it also uploads installers as a *draft* GitHub
      # Release (see electron-builder.yml: publish.releaseType: draft) —
      # nothing is public/auto-updatable until you publish that draft.
      - name: Build/release Electron app
        uses: samuelmeuli/action-electron-builder@v1
        env:
          # Unsigned build: skip macOS code-signing identity lookup so CI
          # doesn't fail hunting for a certificate we don't have.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release: ${{ startsWith(github.ref, 'refs/tags/v') }}
